name: hearth
description: Smart home kiosk — Immich photos, HA controls, Music Assistant, Frigate cameras.
publish_to: 'none'
version: 1.13.8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  # Video playback for live camera streams via RTSP.
  # media_kit wraps libmpv — works on Windows, Linux x64, and Linux ARM64.
  # On Raspberry Pi with flutter-pi, swap to flutterpi_gstreamer_video_player
  # (same video_player API, uses GStreamer instead of mpv).
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_linux: ^1.1.3
  video_player: ^2.9.1
  bonsoir: ^6.0.2
  ffi: ^2.2.0
  sendspin_dart:
    git:
      url: https://github.com/chrisuthe/sendspin_dart.git
      ref: v0.0.7
  flutterpi_gstreamer_video_player:
    git:
      url: https://github.com/chrisuthe/flutterpi_gstreamer_video_player-hearth.git
      # webviewInitScript API (HA token injection). Bump back to `main` once
      # the plugin PR merges.
      ref: chrisuthe/feat/webview-init-script
      path: packages/flutterpi_gstreamer_video_player
  mqtt_client: ^10.11.11
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  # Lets tests mock the app-support directory (PathProviderPlatform.instance)
  # without TestWidgetsFlutterBinding, so real-socket server tests can also
  # exercise on-disk config persistence. See update_source_persistence_test.dart.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/alarm_tones/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    # Vendored from the (unmaintained) weather_icons package, whose `WIData
    # extends IconData` no longer compiles now that Flutter sealed IconData.
    # See lib/utils/weather_icons.dart.
    - family: WeatherIcons
      fonts:
        - asset: assets/fonts/weathericons-regular-webfont.ttf
          weight: 400
