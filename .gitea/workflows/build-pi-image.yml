name: Build Pi Bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: pi-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build bundle and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install flutterpi_tool
        # Installed from an unreleased upstream commit: the latest pub.dev
        # release (0.12.0) does not compile against Flutter 3.47's
        # flutter_tools, and upstream's 3.47 support is not published yet.
        # Pinned by full SHA so the ref cannot move. Go back to a pub.dev
        # version once one ships with 3.47 support — see issue #226.
        #
        # Renovate anchor: dart pub global activate flutterpi_tool 0.12.0
        # The line above is not executed. It keeps the flutterpi_tool custom
        # manager in renovate.json matching, so Renovate opens a PR when a
        # newer release appears — the signal to act on #226.
        run: dart pub global activate --source git https://github.com/ardera/flutterpi_tool --git-ref 248d79914b84ce89b44435ad8f104e81a37e1ffc

      - name: Swap dependencies for Pi
        run: ./scripts/prepare-pi-build.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Cross-compile for Pi 5
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutterpi_tool build --release --arch=arm64 --cpu=pi4

      - name: Package bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-dev}"
          # Export so the later checksum step sees the same VERSION (each step
          # runs in its own shell). Without this the checksum step's
          # ${VERSION:-dev} fell back to dev, naming the asset
          # hearth-bundle-dev.sha256.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SRC_DIR=$(find build/flutter-pi -maxdepth 1 -type d ! -name flutter-pi | head -1)
          if [ -z "$SRC_DIR" ] || [ ! -f "$SRC_DIR/app.so" ]; then
            echo "ERROR: Could not find flutter-pi bundle"
            exit 1
          fi
          # Ship the OTA updater inside the bundle so devices self-refresh
          # /usr/bin/hearth-updater on the next run (see scripts/hearth-updater.sh).
          cp scripts/hearth-updater.sh "$SRC_DIR/hearth-updater.sh"
          # The updater installs this to /usr/local/bin/hearth-launch; the unit
          # execs that copy, never the one in the bundle.
          cp scripts/hearth-launch.sh "$SRC_DIR/hearth-launch.sh"
          tar czf "hearth-bundle-${VERSION}.tar.gz" -C "$SRC_DIR" .

      - name: Generate checksum
        run: |
          sha256sum hearth-bundle-*.tar.gz > hearth-bundle-${VERSION:-dev}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SERVER="${GITHUB_SERVER_URL}"
          REPO="${GITHUB_REPOSITORY}"

          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"Hearth ${TAG}\", \"body\": \"Hearth ${TAG} release\"}" \
            "${SERVER}/api/v1/repos/${REPO}/releases" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          echo "Created release ID: ${RELEASE_ID}"

          for FILE in hearth-bundle-*.tar.gz hearth-bundle-*.sha256; do
            if [ -f "$FILE" ]; then
              curl -s -X POST \
                -H "Authorization: token ${GITEA_TOKEN}" \
                -F "attachment=@${FILE}" \
                "${SERVER}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets"
              echo "Uploaded $FILE"
            fi
          done

  build-apk:
    # Experimental target, built on the same triggers as the bundle. Runs
    # after it rather than beside it: the release must exist before the APK
    # can attach, a failure here cannot touch the bundle already published,
    # and two jobs extracting Flutter into the runner's shared toolcache at
    # once is the race .gitea/workflows/build.yml describes.
    name: Build APK and attach to release
    needs: [build-and-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 9.1 is verified on 17 only.
          java-version: '17'

      # Gradle installs the NDK, CMake and the extra platforms on its own once
      # the licenses are accepted, which this action does.
      - uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          # Unset secrets arrive empty and the script falls back to the debug
          # key, which changes per run: such an APK will not install over the
          # previous release's.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-apk.sh

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SERVER="${GITHUB_SERVER_URL}"
          REPO="${GITHUB_REPOSITORY}"

          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${SERVER}/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: no release found for ${TAG}"
            exit 1
          fi

          for FILE in hearth-android-*.apk hearth-android-*.sha256; do
            curl -sf -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${FILE}" \
              "${SERVER}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets"
            echo "Uploaded $FILE"
          done
