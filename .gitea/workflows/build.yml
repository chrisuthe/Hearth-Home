name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Ref-independent on purpose. A pull_request run and the push run for the merge
# that closes it have different refs, so a per-ref group let them overlap — and
# on the self-hosted runner they share /opt/hostedtoolcache, so the second job
# could pick up a half-extracted Flutter SDK and fail on a missing shared.sh.
# Queue rather than cancel: cancelling would kill an in-flight PR check whenever
# an unrelated merge landed.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than `channel: stable`, which floated onto whatever
          # Flutter had released that day — so a Flutter release could turn CI
          # red without a commit, and the toolcache was re-extracted each time.
          #
          # All four workflow files (GitHub + Gitea, desktop + Pi) share this
          # single value. Renovate keys updates on name + current value, so a
          # split here produces competing update branches. Bump all four
          # together, and only after flutterpi_tool supports the new version.
          #
          # HELD AT 3.41.6 — DO NOT BUMP WITHOUT RE-TESTING 1080p PLAYBACK.
          # The 3.44.9 engine segfaults flutter-pi a few seconds into a 1080p
          # h264 direct-play stream on the Pi. Bisected on hardware: 3.44.9
          # crashed 2/2 on the same file, 3.41.6 and 3.38.0 played it fine, and
          # 720p is unaffected on all three. Renovate will keep offering newer
          # Flutter releases and they are review-gated for exactly this reason.
          # Before accepting one, cast a 1080p direct-play title on a real Pi.
          # See docs/specs/2026-08-12-dependency-maintenance-process-design.md.
          flutter-version: '3.41.6'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
