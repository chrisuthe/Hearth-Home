name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Ref-independent on purpose. A pull_request run and the push run for the merge
# that closes it have different refs, so a per-ref group let them overlap — and
# on the self-hosted runner they share /opt/hostedtoolcache, so the second job
# could pick up a half-extracted Flutter SDK and fail on a missing shared.sh.
# Queue rather than cancel: cancelling would kill an in-flight PR check whenever
# an unrelated merge landed.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned, and deliberately the same version build-pi-image.yml uses to
          # build the shipped bundle — `channel: stable` floated onto whatever
          # Flutter had released that day, so tests validated a toolchain we
          # don't ship. Bump both files together.
          flutter-version: '3.38.0'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
