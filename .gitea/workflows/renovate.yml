name: Renovate

on:
  schedule:
    - cron: '3 6 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — log what would change without creating branches, PRs, or the dashboard issue'
        type: boolean
        default: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:41
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        # Manual runs default to a dry run so a config change can be proven
        # before it is allowed to write anything — the failure mode this guards
        # against is a customManager regex that matches nothing, which Renovate
        # reports as "no updates" rather than as an error.
        #
        # The comparison is done in bash rather than a `${{ }}` ternary because a
        # workflow_dispatch boolean may arrive as the STRING "false", which is
        # truthy in expression syntax and would silently invert the default.
        # On a schedule trigger `inputs` is empty, so this collapses to a live run.
        #
        # LOG_LEVEL is raised to debug only for dry runs: Renovate emits the
        # per-manager, per-dependency detail you actually need to check at debug
        # level, but that is far too noisy for the weekly scheduled run.
        run: |
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "=== DRY RUN — no branches, PRs, or issues will be created ==="
            LOG_LEVEL=debug renovate --dry-run=full
          else
            renovate
          fi
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://registry.home.chrisuthe.com/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: chris/Hearth
          RENOVATE_GIT_AUTHOR: 'Renovate <renovate@chrisuthe.com>'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # GitHub datasources (github-tags, flutter-version) are rate-limited
          # hard for anonymous callers. Without this, lookups fail intermittently
          # and Renovate reports "no updates" rather than an error.
          #
          # Named RENOVATE_GITHUB_COM_TOKEN, not GITHUB_COM_TOKEN: Gitea reserves
          # the GITHUB_ prefix for secret names, so `secrets.GITHUB_COM_TOKEN`
          # cannot be created and would silently resolve to an empty string —
          # leaving Renovate to run anonymous and rate-limited. The RENOVATE_
          # prefix is also Renovate's own convention for self-hosted config.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          LOG_LEVEL: info
