name: Build Pi Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Weekly canary. Desktop CI runs only `flutter analyze` + `flutter test`,
  # which never invokes flutterpi_tool, never cross-compiles for arm64, and
  # never links GStreamer. This catches a dependency that stops building for
  # the Pi within a week instead of at release time.
  #
  # Publishes nothing: the `release` job below is gated on a v* tag ref, so a
  # scheduled run performs `build-bundle` only.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Cross-compile Flutter bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install flutterpi_tool
        run: dart pub global activate flutterpi_tool 0.11.0

      - name: Swap dependencies for Pi
        run: ./scripts/prepare-pi-build.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Cross-compile for Pi 5
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutterpi_tool build --release --arch=arm64 --cpu=pi4

      - name: Package bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-dev}"
          # Sanitize: branch names like task/screen-capture contain slashes
          # that break the tarball path. Collapse to dashes.
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SRC_DIR=$(find build/flutter-pi -maxdepth 1 -type d ! -name flutter-pi | head -1)
          if [ -z "$SRC_DIR" ] || [ ! -f "$SRC_DIR/app.so" ]; then
            echo "ERROR: Could not find flutter-pi bundle"
            exit 1
          fi
          # Ship the OTA updater inside the bundle so devices self-refresh
          # /usr/bin/hearth-updater on the next run (see scripts/hearth-updater.sh).
          cp scripts/hearth-updater.sh "$SRC_DIR/hearth-updater.sh"
          # Package the full flutterpi_tool output as-is (default layout).
          # Includes flutter-pi binary, libflutter_engine.so, app.so, and assets.
          tar czf "hearth-bundle-${VERSION}.tar.gz" -C "$SRC_DIR" .

      - name: Generate checksum
        run: |
          sha256sum hearth-bundle-*.tar.gz > hearth-bundle-${VERSION:-dev}.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: hearth-bundle
          path: |
            hearth-bundle-*.tar.gz
            hearth-bundle-*.sha256

  release:
    name: Publish to GitHub Release
    needs: [build-bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Name the artifact and its destination explicitly. Downloading *all*
      # artifacts puts each in a directory named after it — but only in some
      # versions of the action, and v1.18.1 shipped with no assets at all
      # because the v4 -> v8 bump (939b3a4) moved them out from under the glob
      # below. Pinning both ends the dependence on that default.
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: hearth-bundle
          path: hearth-bundle

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hearth-bundle/hearth-bundle-*.tar.gz
            hearth-bundle/hearth-bundle-*.sha256
          # Without this an unmatched glob is only a warning, so the job goes
          # green having published a release with nothing attached — which is
          # exactly how v1.18.1 shipped a bundle-less release and broke OTA for
          # devices on updateSource: github. Fail loudly instead.
          fail_on_unmatched_files: true
          generate_release_notes: true
