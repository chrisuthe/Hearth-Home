name: Build Pi Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Weekly canary. Desktop CI runs only `flutter analyze` + `flutter test`,
  # which never invokes flutterpi_tool, never cross-compiles for arm64, and
  # never links GStreamer. This catches a dependency that stops building for
  # the Pi within a week instead of at release time.
  #
  # Publishes nothing: the `release` job below is gated on a v* tag ref, so a
  # scheduled run performs `build-bundle` and `build-apk` only.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Cross-compile Flutter bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install flutterpi_tool
        # Installed from an unreleased upstream commit: the latest pub.dev
        # release (0.12.0) does not compile against Flutter 3.47's
        # flutter_tools, and upstream's 3.47 support is not published yet.
        # Pinned by full SHA so the ref cannot move. Go back to a pub.dev
        # version once one ships with 3.47 support — see issue #226.
        #
        # Renovate anchor: dart pub global activate flutterpi_tool 0.12.0
        # The line above is not executed. It keeps the flutterpi_tool custom
        # manager in renovate.json matching, so Renovate opens a PR when a
        # newer release appears — the signal to act on #226.
        run: dart pub global activate --source git https://github.com/ardera/flutterpi_tool --git-ref 248d79914b84ce89b44435ad8f104e81a37e1ffc

      - name: Swap dependencies for Pi
        run: ./scripts/prepare-pi-build.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Cross-compile for Pi 5
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutterpi_tool build --release --arch=arm64 --cpu=pi4

      - name: Package bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-dev}"
          # Sanitize: branch names like task/screen-capture contain slashes
          # that break the tarball path. Collapse to dashes.
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SRC_DIR=$(find build/flutter-pi -maxdepth 1 -type d ! -name flutter-pi | head -1)
          if [ -z "$SRC_DIR" ] || [ ! -f "$SRC_DIR/app.so" ]; then
            echo "ERROR: Could not find flutter-pi bundle"
            exit 1
          fi
          # Ship the OTA updater inside the bundle so devices self-refresh
          # /usr/bin/hearth-updater on the next run (see scripts/hearth-updater.sh).
          cp scripts/hearth-updater.sh "$SRC_DIR/hearth-updater.sh"
          # The updater installs this to /usr/local/bin/hearth-launch; the unit
          # execs that copy, never the one in the bundle.
          cp scripts/hearth-launch.sh "$SRC_DIR/hearth-launch.sh"
          # Package the full flutterpi_tool output as-is (default layout).
          # Includes flutter-pi binary, libflutter_engine.so, app.so, and assets.
          tar czf "hearth-bundle-${VERSION}.tar.gz" -C "$SRC_DIR" .

      - name: Generate checksum
        run: |
          sha256sum hearth-bundle-*.tar.gz > hearth-bundle-${VERSION:-dev}.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: hearth-bundle
          path: |
            hearth-bundle-*.tar.gz
            hearth-bundle-*.sha256

  build-apk:
    # Experimental target. Rides the same triggers as the bundle so every
    # release, manual run and weekly canary also produces an APK — nothing
    # else in CI runs Gradle.
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The voice satellite builds from the Ava fork submodule.
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 9.1 is verified on 17 only.
          java-version: '17'

      # Gradle installs the NDK, CMake and the extra platforms on its own once
      # the licenses are accepted, which this action does.
      - uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          # Unset secrets arrive empty and the script falls back to the debug
          # key, which changes per run: such an APK will not install over the
          # previous release's.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hearth-apk
          path: |
            hearth-android-*.apk
            hearth-android-*.sha256

  release:
    name: Publish to GitHub Release
    needs: [build-bundle, build-apk]
    runs-on: ubuntu-latest
    # Waits for the APK but does not depend on it: a broken Android build must
    # not hold back the bundle that Pi devices update from.
    if: ${{ always() && needs.build-bundle.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      # Name the artifact and its destination explicitly. Downloading *all*
      # artifacts puts each in a directory named after it — but only in some
      # versions of the action, and v1.18.1 shipped with no assets at all
      # because the v4 -> v8 bump (939b3a4) moved them out from under the glob
      # below. Pinning both ends the dependence on that default.
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: hearth-bundle
          path: hearth-bundle

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hearth-bundle/hearth-bundle-*.tar.gz
            hearth-bundle/hearth-bundle-*.sha256
          # Without this an unmatched glob is only a warning, so the job goes
          # green having published a release with nothing attached — which is
          # exactly how v1.18.1 shipped a bundle-less release and broke OTA for
          # devices on updateSource: github. Fail loudly instead.
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Download APK artifact
        if: needs.build-apk.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: hearth-apk
          path: hearth-apk

      - name: Attach APK to release
        if: needs.build-apk.result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hearth-apk/hearth-android-*.apk
            hearth-apk/hearth-android-*.sha256
          fail_on_unmatched_files: true
