name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Kept in step with .gitea/workflows/build.yml. GitHub-hosted runners get a
# fresh VM per job so they don't hit the shared-toolcache race that motivated
# this on Gitea, but the two files are maintained as a pair.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than `channel: stable`, which floated onto whatever
          # Flutter had released that day — so a Flutter release could turn CI
          # red without a commit, and the toolcache was re-extracted each time.
          #
          # All four workflow files (GitHub + Gitea, desktop + Pi) share this
          # single value. Renovate keys updates on name + current value, so a
          # split here produces competing update branches. Bump all four
          # together, and only after flutterpi_tool supports the new version.
          #
          # RE-TEST 1080p PLAYBACK ON A REAL PI BEFORE BUMPING.
          # The 3.44.9 engine segfaulted flutter-pi a few seconds into a 1080p
          # h264 direct-play stream on the Pi (2/2 on one file; 3.41.6 and
          # 3.38.0 played it, 720p was unaffected). 3.47.6 was accepted after
          # it booted on the Pi and direct-played a generated 1080p h264 clip
          # for 60s — but 3.44.9 played that clip too, so the original crash
          # was not reproduced and is not proven fixed. Flutter bumps stay
          # review-gated: cast a 1080p direct-play title on a real Pi first.
          # See docs/specs/2026-08-12-dependency-maintenance-process-design.md.
          flutter-version: '3.47.6'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
